name: "Testing"

on:
  push:
    branches: [ master, yarilo-patches ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, yarilo-patches ]

permissions:
  contents: read

jobs:
  test:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Pin a modern toolchain: upstream go.mod still declares `go 1.13`
          # but the code uses 1.20+ stdlib (errors.Join, strings.CutSuffix).
          go-version: 'stable'
      - name: "Unit & module tests"
        run: go test ./...
